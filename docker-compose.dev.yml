# Local dev only. Postgres 16 is the only service defined here — the office
# app itself runs on the host (see README.md), not in a container.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office
      POSTGRES_DB: office
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
